# Bromine build configuration (sourced by scripts/rebrand.sh)

# Display name that replaces "Titanium" (the text "Titanium Extension" is left alone,
# because that is a separate app by the upstream author).
BROMINE_NAME="Bromine"

# Android applicationId for YOUR build. Must be unique to you. Change this before building.
BROMINE_PACKAGE="io.github.CHANGEME.bromine"

# The applicationId the Titanium base uses today (from its Play Store listing).
OLD_PACKAGE="io.github.jqssun.helium"
